name: api

on:
  pull_request:
    branches: [develop, main]
    paths:
      - apps/api/**
      - infra/**
      - .dockerignore
      - .gitattributes
      - .github/workflows/api.yml
  push:
    branches: [develop, main]
    paths:
      - apps/api/**
      - infra/**
      - .dockerignore
      - .gitattributes
      - .github/workflows/api.yml

permissions:
  contents: read

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Check gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run short tests
        run: go test ./... -short -race -count=1

      - name: Run vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: apps/api

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Check sqlc drift
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          sqlc diff

      - name: Build all Go packages
        run: go build ./...

      # The non-short run exercises the migration and preflight tests through
      # Testcontainers on the hosted runner's Docker daemon.
      - name: Run integration tests
        run: go test ./... -race -count=1 -timeout 10m

  migration:
    name: Compose migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml config --quiet

      - name: Apply migrations in the pinned database image
        run: >-
          docker compose --env-file infra/image-pins.env
          -f infra/docker-compose.yml
          up --build --abort-on-container-exit --exit-code-from migrate migrate

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml logs --no-color

      - name: Tear down Compose resources
        if: always()
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml down --volumes --remove-orphans
