      - name: Validate Compose and E2E harness configuration
        run: |
          node --test scripts/e2e-infra.test.mjs
          docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml config --quiet

      - name: Prepare mail sink directory
        run: mkdir -p .data/mail-sink

      - name: Build and start the stack
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml up --build --detach

      - name: Wait for the web proxy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BASE_URL/api/v1/healthz" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml ps
          exit 1

      - name: Run auth Playwright (verification required)
        env:
          BASE_URL: http://127.0.0.1:3000
          E2E_STACK: '1'
          E2E_VERIFY: 'true'
          MAIL_SINK_DIR: /work/.data/mail-sink
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . infra/image-pins.env
          set +a
          set +e
          docker run --rm --network host \
            --env BASE_URL \
            --env APP_ORIGIN \
            --env E2E_STACK \
            --env E2E_VERIFY \
            --env MAIL_SINK_DIR \
            --env CI \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$PLAYWRIGHT_IMAGE" \
            npx --yes pnpm@10.34.5 --filter @engram/web exec playwright test \
              e2e/auth.spec.ts e2e/a11y.spec.ts --reporter=list
          status=$?
          set -e
          echo "E2E_EXIT_STATUS=$status" >> "$GITHUB_ENV"
          exit "$status"

      - name: Stage sanitized verification-required artifacts
        if: always()
        run: node scripts/sanitize-e2e-artifacts.mjs

      - name: Upload allowlisted verification-required screenshots and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-verify-true
          path: .data/e2e-artifacts
          if-no-files-found: ignore

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml logs --no-color

      - name: Tear down Compose resources
        if: always()
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml down --volumes --remove-orphans

  e2e-journey-verify-true:
    name: Vault journey e2e (email verification required)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # WebAuthn RP ID = host of APP_ORIGIN; Chrome rejects an IP address, so this job uses a hostname (advisor-dec-050).
      BASE_URL: http://localhost:3000
      APP_ORIGIN: http://localhost:3000
      AUTH_FAKE_OAUTH: 'true'
      AUTH_REQUIRE_EMAIL_VERIFICATION: 'true'
    steps:
      - name: Check out repository
