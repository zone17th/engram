          exit 1

      - name: Run content a11y Playwright (verification required)
        env:
          E2E_CONTENT_A11Y: '1'
          BASE_URL: http://localhost:3000
          E2E_STACK: '1'
          E2E_VERIFY: 'true'
          NEXT_PUBLIC_CONTENT_ENABLED: 'true'
