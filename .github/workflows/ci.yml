      - name: Build and start the stack
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml up --build --detach

      - name: Wait for the web proxy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BASE_URL/api/v1/healthz" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml ps
          exit 1

      - name: Run content Playwright (verification required)
        env:
          BASE_URL: http://localhost:3000
          E2E_STACK: '1'
          E2E_VERIFY: 'true'
          NEXT_PUBLIC_CONTENT_ENABLED: 'true'
          MAIL_SINK_DIR: /work/.data/mail-sink
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . infra/image-pins.env
          set +a
          set +e
          docker run --rm --network host \
            --env BASE_URL \
            --env APP_ORIGIN \
            --env E2E_STACK \
            --env E2E_VERIFY \
            --env NEXT_PUBLIC_CONTENT_ENABLED \
            --env MAIL_SINK_DIR \
            --env PLAYWRIGHT_NO_COPY_PROMPT \
