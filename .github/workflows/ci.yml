name: ci

# One run per pull request into develop: opened, every new push to it, reopened.
# Pushes to develop, main or any other branch do not run CI.
on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # --- api ---
  api-check:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Check gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run short tests
        run: go test ./... -short -race -count=1

      - name: Run vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: apps/api

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Check sqlc drift
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          sqlc diff

      - name: Build all Go packages
        run: go build ./...

      # The non-short run exercises the migration and preflight tests through
      # Testcontainers on the hosted runner's Docker daemon.
      - name: Run integration tests
        run: go test ./... -race -count=1 -timeout 10m

  api-migration:
    name: Compose migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml config --quiet

      - name: Apply migrations in the pinned database image
        run: >-
          docker compose --env-file infra/image-pins.env
          -f infra/docker-compose.yml
          up --build --abort-on-container-exit --exit-code-from migrate migrate

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml logs --no-color

      - name: Tear down Compose resources
        if: always()
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml down --volumes --remove-orphans

  # --- web ---
  web-check:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated OpenAPI client
        shell: bash
        run: |
          pnpm --filter @engram/shared-types generate
          git diff --exit-code -- packages/shared-types/src/api.d.ts

      - name: Run lint
        run: pnpm -r lint

      - name: Run type checks
        run: pnpm -r typecheck

      - name: Run unit tests
        run: pnpm -r test

      - name: Build web application
        run: pnpm --filter @engram/web build

  # --- e2e ---
  e2e-browser:
    name: Browser smoke and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # WebAuthn RP ID = host of APP_ORIGIN; Chrome rejects an IP address, so this job uses a hostname (advisor-dec-050).
      BASE_URL: http://localhost:3000
      APP_ORIGIN: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate E2E harness configuration
        run: node --test scripts/e2e-infra.test.mjs

      - name: Prepare mail sink directory
        run: mkdir -p .data/mail-sink

      - name: Validate Compose configuration
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml config --quiet

      - name: Build and start the stack
        env:
          AUTH_FAKE_OAUTH: 'true'
          AUTH_REQUIRE_EMAIL_VERIFICATION: 'false'
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml up --build --detach

      - name: Wait for the web proxy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BASE_URL/api/v1/healthz" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml ps
          exit 1

      # Run in the pinned Playwright image so Linux browser and font rendering
      # stay reproducible across CI runs and future visual review.
      - name: Run browser checks in pinned Playwright image
        env:
          BASE_URL: http://localhost:3000
          E2E_STACK: '1'
          E2E_VERIFY: 'false'
          MAIL_SINK_DIR: /work/.data/mail-sink
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . infra/image-pins.env
          set +a
          set +e
          docker run --rm --network host \
            --env BASE_URL \
            --env APP_ORIGIN \
            --env E2E_STACK \
            --env E2E_VERIFY \
            --env MAIL_SINK_DIR \
            --env CI \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$PLAYWRIGHT_IMAGE" \
            npx --yes pnpm@10.34.5 --filter @engram/web exec playwright test
          status=$?
          set -e
          echo "E2E_EXIT_STATUS=$status" >> "$GITHUB_ENV"
          exit "$status"


      - name: Run real Crypto Worker production CSP checks (CF T-5, FE2-11e)
        env:
          BASE_URL: http://localhost:3000
          E2E_STACK: '1'
          E2E_VAULT_PROD: '1'
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . infra/image-pins.env
          set +a
          docker run --rm --network host \
            --env BASE_URL \
            --env APP_ORIGIN \
            --env E2E_STACK \
            --env E2E_VAULT_PROD \
            --env CI \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$PLAYWRIGHT_IMAGE" \
            npx --yes pnpm@10.34.5 --filter @engram/web exec playwright test --project=vault-prod --output=test-results-vault-prod e2e/lock.spec.ts e2e/lock-epoch.spec.ts
      - name: Stage sanitized browser artifacts
        if: always()
        run: node scripts/sanitize-e2e-artifacts.mjs

      - name: Upload allowlisted a11y screenshots and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: .data/e2e-artifacts
          if-no-files-found: ignore

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml logs --no-color

      - name: Tear down Compose resources
        if: always()
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml down --volumes --remove-orphans

  e2e-auth-verify-true:
    name: Auth e2e (email verification required)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_URL: http://127.0.0.1:3000
      APP_ORIGIN: http://127.0.0.1:3000
      AUTH_FAKE_OAUTH: 'true'
      AUTH_REQUIRE_EMAIL_VERIFICATION: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Compose and E2E harness configuration
        run: |
          node --test scripts/e2e-infra.test.mjs
          docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml config --quiet

      - name: Prepare mail sink directory
        run: mkdir -p .data/mail-sink

      - name: Build and start the stack
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml up --build --detach

      - name: Wait for the web proxy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BASE_URL/api/v1/healthz" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml ps
          exit 1

      - name: Run auth Playwright (verification required)
        env:
          BASE_URL: http://127.0.0.1:3000
          E2E_STACK: '1'
          E2E_VERIFY: 'true'
          MAIL_SINK_DIR: /work/.data/mail-sink
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . infra/image-pins.env
          set +a
          set +e
          docker run --rm --network host \
            --env BASE_URL \
            --env APP_ORIGIN \
            --env E2E_STACK \
            --env E2E_VERIFY \
            --env MAIL_SINK_DIR \
            --env CI \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$PLAYWRIGHT_IMAGE" \
            npx --yes pnpm@10.34.5 --filter @engram/web exec playwright test \
              e2e/auth.spec.ts e2e/a11y.spec.ts --reporter=list
          status=$?
          set -e
          echo "E2E_EXIT_STATUS=$status" >> "$GITHUB_ENV"
          exit "$status"

      - name: Stage sanitized verification-required artifacts
        if: always()
        run: node scripts/sanitize-e2e-artifacts.mjs

      - name: Upload allowlisted verification-required screenshots and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-verify-true
          path: .data/e2e-artifacts
          if-no-files-found: ignore

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml logs --no-color

      - name: Tear down Compose resources
        if: always()
        run: docker compose --env-file infra/image-pins.env -f infra/docker-compose.yml down --volumes --remove-orphans
