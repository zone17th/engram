  # P04 lane acceptance (Task 21c, advisor pre-grant 2026-11-02): the a11y/visual sweep runs in its own job so the
  # Content e2e job keeps its 30 min budget for the journey. content-a11y-*.spec.ts skip unless E2E_CONTENT_A11Y=1.
  e2e-content-a11y:
    name: Content a11y
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # WebAuthn RP ID = host of APP_ORIGIN; Chrome rejects an IP address, so this job uses a hostname (advisor-dec-050).
      BASE_URL: http://localhost:3000
      APP_ORIGIN: http://localhost:3000
      AUTH_FAKE_OAUTH: 'false'
      AUTH_REQUIRE_EMAIL_VERIFICATION: 'true'
      NEXT_PUBLIC_CONTENT_ENABLED: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
