name: web

on:
  pull_request:
    branches: [develop, main]
    paths:
      - apps/web/**
      - packages/**
      - apps/api/api/openapi.yaml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web.yml
  push:
    branches: [develop, main]
    paths:
      - apps/web/**
      - packages/**
      - apps/api/api/openapi.yaml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web.yml

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated OpenAPI client
        shell: bash
        run: |
          pnpm --filter @engram/shared-types generate
          git diff --exit-code -- packages/shared-types/src/api.d.ts

      - name: Run lint
        run: pnpm -r lint

      - name: Run type checks
        run: pnpm -r typecheck

      - name: Run unit tests
        run: pnpm -r test

      - name: Build web application
        run: pnpm --filter @engram/web build
