            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryMeta'
        '400':
          description: Body sai hoặc entry không hợp lệ (type/envelope/base64url/bucket/ID, ciphertext < 17 B) (invalid_request, entry_invalid)
