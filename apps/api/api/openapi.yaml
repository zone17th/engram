openapi: 3.1.0
info:
  title: engram API
  version: 0.3.0
  description: |
    API của engram. P01: health/ready/metrics. P02: 26 operation tài khoản/session.
    P03: 15 operation vault, recovery key và passkey WebAuthn PRF (server không bao giờ nhận
    passphrase, KEK, VK, plaintext RK, PWK hay private key chưa wrap).
    Mọi lỗi dùng RFC 9457 (application/problem+json). Auth dùng cookie host-only,
    không dùng HTTP Bearer. Response auth và vault: Cache-Control: no-store (riêng GET /vault: no-store, no-transform; không có ETag).
servers:
  - url: /api/v1
tags:
  - name: ops
  - name: auth
  - name: account
  - name: vault
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [ops]
      summary: Tiến trình còn sống
      responses:
        '200':
          description: Tiến trình đang chạy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /readyz:
    get:
      operationId: getReadyz
      tags: [ops]
      summary: Phụ thuộc bắt buộc đã sẵn sàng
      responses:
        '200':
          description: Sẵn sàng nhận traffic
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, checks, semantic_available]
                properties:
                  status:
                    type: string
                    const: ready
                  checks:
                    type: object
                    additionalProperties:
                      type: string
                  semantic_available:
                    type: boolean
                    description: false khi EMBEDDING_PROVIDER=noop, thiếu TEI_URL, hoặc probe runtime fail.
        '503':
          $ref: '#/components/responses/Problem'
  /metrics:
    get:
      operationId: getMetrics
      tags: [ops]
      summary: Số liệu Prometheus (chỉ dành cho vận hành)
      responses:
        '200':
          description: Dạng text phơi bày của Prometheus
          content:
            text/plain:
              schema:
                type: string

  /auth/config:
    get:
      operationId: authConfig
      tags: [auth]
      summary: Cấu hình auth công khai
      description: Provider đang bật, cờ verification, site key CAPTCHA. Không lộ secret.
      security: []
      responses:
        '200':
          description: Cấu hình public
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'

  /auth/csrf:
    get:
      operationId: authCsrf
      tags: [auth]
      summary: Bootstrap cookie CSRF
      description: |
        204 + đặt/giữ cookie. Session còn hiệu lực ký theo session ID; chưa có session
        dùng nonce anonymous. Không rotate nonce còn hạn. Không phải đăng nhập.
      security: []
      responses:
        '204':
          description: Cookie CSRF đã sẵn
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: sabk_csrf (và sabk_anon nếu chưa có session)
              schema: { type: string }
        '403':
          $ref: '#/components/responses/Problem'

  /auth/signup:
    post:
      operationId: authSignup
      tags: [auth]
      summary: Đăng ký email/password
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Tài khoản + session mới; vault absent
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Đăng nhập email/password
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session mới chống fixation
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [auth]
      summary: Xoay refresh token
      description: Không cần access còn hạn. Cookie sabk_refresh + CSRF gắn session tìm được.
      security:
        - refreshCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Cookie access/refresh mới; CSRF session giữ nguyên
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Đăng xuất
      description: Session hoặc refresh + CSRF. Session đã revoke vẫn có thể clear cookie và 204.
      security:
        - csrfHeader: []
      responses:
        '204':
          description: Cookie auth đã xoá; preference giữ
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '403':
          $ref: '#/components/responses/Problem'

  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Tài khoản hiện tại
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Me
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'

  /auth/oauth/{provider}/start:
    get:
      operationId: authOauthStart
      tags: [auth]
      summary: Bắt đầu OAuth login
      description: Chỉ mode login. 302 tới provider. Không dùng query mode=link.
      security: []
      parameters:
        - $ref: '#/components/parameters/OauthProvider'
      responses:
        '302':
          description: Redirect tới authorization endpoint
          headers:
            Location:
              schema: { type: string, format: uri }
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/oauth/{provider}/link:
    post:
      operationId: authOauthLinkStart
      tags: [auth]
      summary: Bắt đầu liên kết provider
      security:
        - sessionCookie: []
          csrfHeader: []
          reauthHeader: []
      parameters:
        - $ref: '#/components/parameters/OauthProvider'
      responses:
        '200':
          description: URL để browser điều hướng
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationURL'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/oauth/{provider}/reauth:
    post:
      operationId: authOauthReauthStart
      tags: [auth]
      summary: Bắt đầu OAuth re-auth
      description: Chỉ provider hỗ trợ freshness (Google khi capability bật).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/OauthProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OauthReauthStartRequest'
      responses:
        '200':
          description: URL để browser điều hướng
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationURL'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/oauth/{provider}/callback:
    get:
      operationId: authOauthCallback
      tags: [auth]
      summary: Callback OAuth từ provider
      description: |
        State + cookie binding + transaction một lần. 303 về web với status allowlist.
        Không đặt cookie session. Không đưa token/grant/email lên query.
      security: []
      parameters:
        - $ref: '#/components/parameters/OauthProvider'
      responses:
        '303':
          description: Redirect web /app/auth/callback/{provider}?status=...
          headers:
            Location:
              schema:
                type: string
                format: uri
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/oauth/complete:
    post:
      operationId: authOauthComplete
      tags: [auth]
      summary: Hoàn tất login OAuth trong Web Lock
      description: Binding cookie + CSRF + transaction ready. Consume một lần; mới đặt session cookie.
      security:
        - csrfHeader: []
      responses:
        '200':
          description: Me + cookie session
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/reauth:
    post:
      operationId: authReauth
      tags: [auth]
      summary: Cấp grant re-auth
      description: |
        oneOf password hoặc provider+receipt. Không gửi cả hai. Grant chỉ trên body, không cookie/URL.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: Grant HMAC
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReauthGrant'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/verify-email/send:
    post:
      operationId: authVerifyEmailSend
      tags: [auth]
      summary: Gửi email xác minh địa chỉ hiện tại
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202':
          description: Đã chấp nhận gửi (token hash đã persist)
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'

  /auth/verify-email/confirm:
    post:
      operationId: authVerifyEmailConfirm
      tags: [auth]
      summary: Xác nhận token verification
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenConfirmRequest'
      responses:
        '200':
          description: Me sau khi verify/đổi email
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/password/enroll/send:
    post:
      operationId: authPasswordEnrollSend
      tags: [auth]
      summary: Gửi token đặt password lần đầu (OAuth-only)
      description: Chỉ khi chưa có password và email hiện tại đã verified. Không phải reset.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202':
          description: Đã chấp nhận gửi
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'

  /auth/sessions:
    get:
      operationId: authSessionsList
      tags: [auth]
      summary: Danh sách phiên còn hiệu lực
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Trang phiên
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Problem'

  /auth/sessions/{id}:
    delete:
      operationId: authSessionRevoke
      tags: [auth]
      summary: Thu hồi một phiên
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Đã thu hồi; nếu là current thì clear cookie
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /auth/sessions/revoke-others:
    post:
      operationId: authSessionsRevokeOthers
      tags: [auth]
      summary: Thu hồi các phiên khác
      security:
        - sessionCookie: []
          csrfHeader: []
          reauthHeader: []
      responses:
        '200':
          description: Số phiên đã thu hồi
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revoked]
                properties:
                  revoked:
                    type: integer
                    minimum: 0
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'

  /auth/identities/{provider}:
    delete:
      operationId: authIdentityUnlink
      tags: [auth]
      summary: Gỡ identity
      description: provider gồm password|google|github. Không gỡ phương thức cuối.
      security:
        - sessionCookie: []
          csrfHeader: []
          reauthHeader: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/IdentityProvider'
      responses:
        '204':
          description: Đã gỡ
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /auth/audit:
    get:
      operationId: authAuditList
      tags: [auth]
      summary: Nhật ký bảo mật của user hiện tại
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Trang audit
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
        '401':
          $ref: '#/components/responses/Problem'

  /me/notifications:
    get:
      operationId: meNotificationsList
      tags: [account]
      summary: Thông báo trong app
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Trang thông báo
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/Problem'

  /me/notifications/{id}:
    patch:
      operationId: meNotificationRead
      tags: [account]
      summary: Đánh dấu đã đọc
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: bigserial dưới dạng decimal string
            pattern: '^[0-9]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [read]
              properties:
                read:
                  type: boolean
                  const: true
      responses:
        '204':
          description: Đã đánh dấu
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /me/settings:
    patch:
      operationId: meSettingsPatch
      tags: [account]
      summary: Cập nhật settings từng phần
      description: Field vắng giữ nguyên. null/unknown = 400. Bật semantic khi probe down = 409, không lưu patch.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: Me sau khi lưu
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /me/email:
    post:
      operationId: meEmailChange
      tags: [account]
      summary: Yêu cầu đổi email
      description: Chưa đổi email trên tài khoản. Gửi proof tới địa chỉ mới.
      security:
        - sessionCookie: []
          csrfHeader: []
          reauthHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_email]
              properties:
                new_email:
                  type: string
                  format: email
      responses:
        '202':
          description: Đã gửi proof
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'

  /me/password:
    post:
      operationId: mePasswordChange
      tags: [account]
      summary: Đổi hoặc đặt password đăng nhập
      description: |
        Password đã có: proof là X-Reauth-Token (account.password_change), không nhập password cũ lần hai.
        OAuth-only: grant freshness hoặc enrollment_token. Không gửi cả grant và enrollment_token.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: Me + session/CSRF mới
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /vault:
    get:
      operationId: vaultGet
      tags: [vault]
      summary: Đọc trạng thái và bản bọc khoá của vault hiện tại
      description: |
        Trả về metadata KDF, các bản wrap AEAD opaque, public key, số RK còn lại và danh sách passkey.
        Cache-Control: no-store, no-transform; không có header ETag (vì danh sách passkeys đổi mà không tăng version).
        Server không bao giờ nhận hay trả về passphrase, KEK, VK, plaintext RK, PWK hay private key chưa wrap.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Trạng thái vault hiện tại
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStoreNoTransform'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultState'
        '401':
          description: Chưa đăng nhập hoặc phiên hết hạn (unauthenticated, access_expired, session_invalid)
          $ref: '#/components/responses/Problem'
        '404':
          description: Người dùng chưa khởi tạo vault (vault_absent)
          $ref: '#/components/responses/Problem'
    post:
      operationId: vaultCreate
      tags: [vault]
      summary: Khởi tạo vault mới kèm đúng 10 recovery key
      description: |
        Tạo vault và 10 RK (slot 1…10) trong một transaction. Server sinh vault_key_id mới.
        Server không bao giờ nhận passphrase, KEK, VK, plaintext RK, PWK hay private key chưa wrap.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultCreateRequest'
      responses:
        '201':
          description: Vault đã tạo thành công
          headers:
            Cache-Control:
