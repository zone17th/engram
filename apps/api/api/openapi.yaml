          $ref: '#/components/responses/Problem'
        '415':
          description: 'Thiếu hoặc sai `Content-Type: application/json` (invalid_request)'
          $ref: '#/components/responses/Problem'
        '428':
          description: Thiếu hoặc sai định dạng If-Match (precondition_required)
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ContentUnavailable'
    delete:
      operationId: entryDelete
      tags: [content]
      summary: Xoá mềm entry (Undo bằng entryRestore trong 30 ngày)
      description: |
        `deleted_at = clock_timestamp()`, `deleted_via='entry'`, `entry_count − 1`; không tăng `version`. Entry đã xoá → `204` không
        đổi gì. Không có request body; DELETE body rỗng không cần `Content-Type` (có body thì phải là `application/json`, không thì `415`).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/EntryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Đã xoá mềm (hoặc đã ở trạng thái xoá)
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          description: ID không phải UUID (invalid_request)
          $ref: '#/components/responses/Problem'
        '401':
          description: Chưa xác thực (unauthenticated, access_expired, session_invalid)
          $ref: '#/components/responses/Problem'
        '403':
          description: Thiếu hoặc sai CSRF/Origin (csrf_invalid, forbidden)
          $ref: '#/components/responses/Problem'
        '404':
          description: Không tìm thấy entry (not_found)
          $ref: '#/components/responses/Problem'
        '409':
          description: 'Xung đột idempotency (idempotency_conflict, idempotency_in_progress kèm Retry-After: 1)'
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          description: Body quá 400 KiB (entry_too_large)
          $ref: '#/components/responses/Problem'
        '415':
          description: 'Có body nhưng không phải `Content-Type: application/json` (invalid_request)'
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ContentUnavailable'

  /entries/{id}/restore:
    post:
      operationId: entryRestore
      tags: [content]
      summary: Khôi phục entry đã xoá riêng
      description: |
        Entry phải `deleted_via='entry'` (`'item'` → `409 entry_restore_via_item`: restore mục thay vì entry); mục phải sống
        (`409 item_deleted`); `entry_count < 200` (`409 item_entry_limit`). Giữ nguyên `position` cũ; không tăng `version`.
        Entry đang sống → `200` không đổi gì. Client gửi `{}` với `Content-Type: application/json` như mọi POST (thiếu header → `415 invalid_request`); server vẫn nhận body rỗng.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/EntryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '200':
          description: Metadata entry sau khi khôi phục
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryMeta'
        '400':
          description: ID không phải UUID (invalid_request)
          $ref: '#/components/responses/Problem'
        '401':
          description: Chưa xác thực (unauthenticated, access_expired, session_invalid)
          $ref: '#/components/responses/Problem'
        '403':
          description: Thiếu hoặc sai CSRF/Origin (csrf_invalid, forbidden)
          $ref: '#/components/responses/Problem'
        '404':
          description: Không tìm thấy entry (đã purge, không tồn tại hoặc của user khác) (not_found)
          $ref: '#/components/responses/Problem'
        '409':
          description: 'Xoá theo mục, mục đã xoá, quá 200 entry hoặc xung đột idempotency (entry_restore_via_item, item_deleted, item_entry_limit, idempotency_conflict, idempotency_in_progress kèm Retry-After: 1)'
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          description: Body quá 400 KiB (entry_too_large)
          $ref: '#/components/responses/Problem'
        '415':
          description: 'Thiếu hoặc sai `Content-Type: application/json` (invalid_request)'
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ContentUnavailable'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sabk_session
    refreshCookie:
      type: apiKey
      in: cookie
      name: sabk_refresh
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    reauthHeader:
      type: apiKey
      in: header
      name: X-Reauth-Token
  headers:
    NoStore:
      schema:
        type: string
        const: no-store
    NoStoreNoTransform:
      description: Cấm lưu cache và cấm proxy/CDN biến đổi body của GET /vault.
      schema:
        type: string
        const: no-store, no-transform
    RetryAfter:
      description: Giây nguyên dương tới cuối cửa sổ rate limit.
      schema:
        type: integer
        minimum: 1
  parameters:
    OauthProvider:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OauthProvider'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Strong tag điều kiện dạng `"<vault_key_id>:<version>"` (bao gồm dấu ngoặc kép).
        Thiếu header, `*`, weak tag hoặc sai định dạng trả `428 precondition_required`;
        lệch `vault_key_id` hoặc `version` trả `412 version_mismatch`.
      schema:
        type: string
        pattern: '^"vk:[A-Za-z0-9_-]{22}:[1-9][0-9]*"$'
        examples: ['"vk:7f3a1c9e02b4d6f89012ab:1"']
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Khoá chống lặp thao tác (16–128 ký tự `[A-Za-z0-9_-]`, UUID v4 sinh một lần cho mỗi thao tác người dùng).
        Giữ 24 giờ; fingerprint tính trên `method + concrete path + body`.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]{16,128}$'
    ReauthToken:
      name: X-Reauth-Token
      in: header
      required: true
      description: Grant re-auth HMAC stateless (`POST /auth/reauth`), TTL 5 phút, gắn `user_id + session_id + action` (thiếu/hết hạn/sai action trả 401 reauth_required hoặc reauth_invalid; khi replay idempotent một thao tác đã commit, bước 2 trả kết quả lưu trước khi kiểm tra grant nên client có thể gửi lại token cũ đã hết hạn).
      schema:
        type: string
        minLength: 1
    PasskeyId:
      name: id
      in: path
      required: true
      description: UUID bản ghi passkey trên vault của người dùng hiện tại (VaultPasskeyItem.id, không phải WebAuthn cred_id).
      schema:
        type: string
        format: uuid
    VersionIfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Strong tag điều kiện dạng `"<version>"` (bao gồm dấu ngoặc kép) với `version` của entry hoặc mục trả trong mọi response
        (số thập phân không có số 0 đứng đầu, 1…2147483647; pattern cho tới 10 chữ số, số vượt int32 trả `428`). Khác pattern `IfMatch` của vault. Thiếu header, `*`, weak tag,
        danh sách hoặc sai định dạng trả `428 precondition_required`; lệch trả `412 version_mismatch` kèm `current_version`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]{0,9}"$'
        examples: ['"3"']
    ItemId:
      name: id
      in: path
      required: true
      description: UUID của mục thuộc user hiện tại (ID của user khác trả như không tồn tại).
      schema:
        type: string
        format: uuid
    ItemTagId:
      name: tag_id
      in: path
      required: true
      description: UUID của tag cần gỡ khỏi mục.
      schema:
        type: string
        format: uuid
    TagId:
      name: id
      in: path
      required: true
      description: UUID của tag thuộc user hiện tại.
      schema:
        type: string
        format: uuid
    EntryId:
      name: id
      in: path
      required: true
      description: UUID chữ thường của entry (ID do client sinh, nằm trong AAD).
      schema:
        type: string
        format: uuid
    ContentSort:
      name: sort
      in: query
      description: '`recent` = `last_used_at DESC, id`; `alpha` = theo tên đã chuẩn hoá, `id`.'
      schema:
        type: string
        enum: [recent, alpha]
        default: recent
    ItemsTagFilter:
      name: tag_id
      in: query
      description: Chỉ trả mục đang gắn tag này (tag sống của user hiện tại).
      schema:
        type: string
        format: uuid
    ItemsQuery:
      name: q
      in: query
      description: Prefix trên `name_normalized`, tối đa 200 rune sau trim; chỉ gửi khi người dùng chủ động tìm.
      schema:
        type: string
    TagsQuery:
      name: q
      in: query
      description: Prefix trên `tag.normalized`, tối đa 50 rune sau trim.
      schema:
        type: string
    LookupName:
      name: name
      in: query
      required: true
      description: Tên mục cần tra cứu chính xác (server chuẩn hoá; 1–200 rune sau trim). Không bao giờ chứa body entry.
      schema:
        type: string
        minLength: 1
    EntriesLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 200
    ChangesLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    ChangesSince:
      name: since
      in: query
      required: false
      description: |
        Mốc RFC 3339 (độ chính xác nano giây được giữ); trang tiếp theo gửi lại đúng giá trị của trang đầu cùng cursor. Không có
        `since` (và không có cursor) → bootstrap: `{changes: [], next_cursor: null, watermark}`, không quét bảng; có cursor mà
        thiếu `since` → `400 invalid_request`.
      schema:
        type: string
        format: date-time
  responses:
    Problem:
      description: Lỗi RFC 9457
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyConflict:
      description: 'Xung đột trạng thái hoặc idempotency; khi code=idempotency_in_progress kèm header Retry-After: 1'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          description: Giây nguyên dương chờ trước khi thử lại cùng Idempotency-Key khi code=idempotency_in_progress (giá trị 1).
          required: false
          schema:
            type: integer
            minimum: 1
            examples: [1]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Quá quota; Retry-After khớp retry_after trong body
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ContentUnavailable:
      description: 'Deadlock, lock timeout hoặc xung đột unique lưới an toàn; transaction chưa commit và claim idempotency đã release, client thử lại cùng Idempotency-Key và byte body sau Retry-After: 1 (dependency_unavailable)'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          description: Giây nguyên dương chờ trước khi thử lại (giá trị 1).
          required: false
          schema:
            type: integer
            minimum: 1
            examples: [1]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ProblemCode:
      type: string
      enum:
        - invalid_request
        - dependency_unavailable
        - internal_error
        - not_found
        - unauthenticated
        - access_expired
        - session_invalid
        - invalid_credentials
        - csrf_invalid
        - forbidden
        - reauth_required
        - reauth_invalid
        - reauth_unsupported_provider
        - rate_limited
        - captcha_required
        - email_not_verified
        - email_taken
        - identity_conflict
        - identity_last_method
        - oauth_state_invalid
        - oauth_provider_error
        - verification_invalid
        - password_weak
        - semantic_unavailable
        - mail_delivery_unavailable
        - vault_exists
        - vault_absent
        - vault_kdf_invalid
        - vault_wrap_invalid
        - vault_mutations_disabled
        - recovery_keys_count
        - recovery_key_slot_taken
        - recovery_key_invalid
        - recovery_key_conflict
        - precondition_required
        - version_mismatch
        - idempotency_conflict
        - idempotency_in_progress
        - passkey_challenge_invalid
        - passkey_attestation_invalid
        - passkey_name_invalid
        - passkey_exists
        - passkey_not_found
        - name_invalid
        - hint_invalid
        - tag_display_invalid
        - item_id_conflict
        - item_deleted
        - item_tag_limit
        - item_entry_limit
        - tag_conflict
        - entry_invalid
        - entry_too_large
        - entry_id_conflict
        - entry_key_mismatch
        - entry_nonce_reused
        - entry_restore_via_item
        - reorder_mismatch
        - changes_window_expired
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          examples: ['https://engram.zone17.click/problems/dependency_unavailable']
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance:
          type: string
          description: Request ID, không phải URL.
        code:
          $ref: '#/components/schemas/ProblemCode'
        retry_after:
          type: integer
          minimum: 1
          description: Giây; khớp header Retry-After (trên 429 rate_limited hoặc 409 idempotency_in_progress với giá trị 1).
        reason:
          type: string
          enum: [revoked, expired, invalid]
          description: Chỉ khi code=session_invalid. Token lạ dùng invalid.
        captcha_required:
          type: boolean
        current_version:
          type: integer
          minimum: 1
          description: Phiên bản hiện tại của vault, mục hoặc entry khi code=version_mismatch (412).
    OauthProvider:
      type: string
      enum: [google, github]
    IdentityProvider:
      type: string
      enum: [password, google, github]
    Locale:
      type: string
      enum: [en, vi]
    Theme:
      type: string
      enum: [system, light, dark]
    AutoLockMinutes:
      type: integer
      enum: [0, 5, 15, 60]
    ReauthAction:
      type: string
      enum:
        - account.email_change
        - account.password_change
        - account.identity_link
        - account.identity_unlink
        - session.revoke_others
        - vault.rewrap
        - vault.recover
        - vault.recovery_keys_regenerate
        - vault.recovery_keys_rotate
        - vault.passkey_register
        - vault.passkey_revoke
        - vault.reset
        - export.decrypted
        - account.delete
    OauthCallbackStatus:
      type: string
      enum:
        - login_ready
        - linked
        - reauth_ready
        - cancelled
        - identity_conflict
        - invalid_flow
        - provider_error
        - reauth_unavailable
    AuthConfig:
      type: object
      additionalProperties: false
      required:
        - oauth_providers
        - email_verification_required
        - captcha_site_key
      properties:
        oauth_providers:
          type: array
          items:
            $ref: '#/components/schemas/OauthProvider'
        email_verification_required:
          type: boolean
        captcha_site_key:
          type: [string, 'null']
    Me:
      type: object
      additionalProperties: false
      required: [user, settings, identities, features, vault]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, email, email_verified, created_at]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            email_verified:
              type: boolean
            created_at:
              type: string
              format: date-time
        settings:
          type: object
          additionalProperties: false
          required: [locale, theme, auto_lock_minutes, semantic_suggest]
          properties:
            locale:
              $ref: '#/components/schemas/Locale'
            theme:
              $ref: '#/components/schemas/Theme'
            auto_lock_minutes:
              $ref: '#/components/schemas/AutoLockMinutes'
            semantic_suggest:
              type: boolean
        identities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [provider, linked_at]
            properties:
              provider:
                $ref: '#/components/schemas/IdentityProvider'
              linked_at:
                type: string
                format: date-time
        features:
          type: object
          additionalProperties: false
          required:
            - semantic_available
            - email_verification_required
            - oauth_providers
            - oauth_reauth_providers
            - password_enrollment_available
            - captcha_site_key
          properties:
            semantic_available:
              type: boolean
            email_verification_required:
              type: boolean
            oauth_providers:
              type: array
              items:
                $ref: '#/components/schemas/OauthProvider'
            oauth_reauth_providers:
              type: array
              items:
                type: string
                enum: [google]
            password_enrollment_available:
              type: boolean
            captcha_site_key:
              type: [string, 'null']
        vault:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [absent, present]
              description: absent | present trên server; locked/unlocked là trạng thái crypto phía client, không phải trạng thái server.
    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 1024
          description: Không trim/normalize. Tối thiểu 12 Unicode; tối đa 1024 byte UTF-8.
        locale:
          $ref: '#/components/schemas/Locale'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 1024
        captcha_token:
          type: string
    TokenConfirmRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    OauthReauthStartRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/ReauthAction'
    AuthorizationURL:
      type: object
      additionalProperties: false
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          format: uri
    ReauthRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [action, password]
          properties:
            action:
              $ref: '#/components/schemas/ReauthAction'
            password:
              type: string
          description: Không kèm provider.
        - type: object
          additionalProperties: false
          required: [action, provider]
          properties:
            action:
              $ref: '#/components/schemas/ReauthAction'
            provider:
              type: string
              enum: [google]
          description: Receipt nằm ở cookie sabk_reauth, không gửi password.
    ReauthGrant:
      type: object
      additionalProperties: false
      required: [grant, action, expires_at]
      properties:
        grant:
          type: string
        action:
          $ref: '#/components/schemas/ReauthAction'
        expires_at:
          type: string
          format: date-time
    SettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
        theme:
          $ref: '#/components/schemas/Theme'
        auto_lock_minutes:
          $ref: '#/components/schemas/AutoLockMinutes'
        semantic_suggest:
          type: boolean
    PasswordChangeRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [new_password]
          properties:
            new_password:
              type: string
              minLength: 12
              maxLength: 1024
          description: Proof là X-Reauth-Token; không enrollment_token.
        - type: object
          additionalProperties: false
          required: [new_password, enrollment_token]
          properties:
            new_password:
              type: string
              minLength: 12
              maxLength: 1024
            enrollment_token:
              type: string
          description: OAuth-only lần đầu; không kèm grant.
    SessionList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionItem'
        next_cursor:
          type: [string, 'null']
    SessionItem:
      type: object
      additionalProperties: false
      required: [id, current, device_label, user_agent, created_at, last_seen_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        device_label:
          type: [string, 'null']
        user_agent:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    AuditList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditItem'
        next_cursor:
          type: [string, 'null']
    AuditItem:
      type: object
      additionalProperties: false
      required: [id, event, result, created_at]
      properties:
        id:
          type: string
          description: bigserial decimal string
          pattern: '^[0-9]+$'
        event:
          type: string
        result:
          type: string
          enum: [success, failure]
        actor:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        meta:
          type: object
          additionalProperties: true
    NotificationList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationItem'
        next_cursor:
          type: [string, 'null']
    NotificationItem:
      type: object
      additionalProperties: false
      required: [id, kind, created_at]
      properties:
        id:
          type: string
          description: bigserial decimal string
          pattern: '^[0-9]+$'
        kind:
          type: string
        meta:
          type: object
          additionalProperties: true
        read_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
    VaultKeyId:
      type: string
      pattern: '^vk:[A-Za-z0-9_-]{22}$'
      description: Định danh khoá vault do server sinh ("vk:" + 16 byte ngẫu nhiên base64url không padding).
    WrappedVaultKey:
      type: string
      pattern: '^[A-Za-z0-9_-]{98}$'
      description: |
        Bản bọc AEAD XChaCha20-Poly1305 IETF của VK dài đúng 73 byte
        (version 0x01 || nonce 24B || ciphertext 32B || tag 16B) mã hoá base64url không padding.
    WrappedPrivateKeys:
      type: string
      pattern: '^[A-Za-z0-9_-]{140}$'
      description: |
        Bản bọc AEAD XChaCha20-Poly1305 IETF của (x25519_seed 32B || ed25519_seed 32B) dài đúng 105 byte
        (version 0x01 || nonce 24B || ciphertext 64B || tag 16B) mã hoá base64url không padding.
    PublicKey32:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: Khoá công khai 32 byte mã hoá base64url không padding.
    RecoveryKeyLookupHash:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: Giá trị băm 32 byte BLAKE2b-256("sabk.rk.lookup.v1" || rk_norm) mã hoá base64url không padding.
    PrfSalt:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: Muối PRF 32 byte riêng cho từng credential WebAuthn, mã hoá base64url không padding.
    VaultKdf:
      type: object
      additionalProperties: false
      required: [alg, ops, mem, parallelism, salt]
      properties:
        alg:
          type: string
          const: argon2id13
        ops:
          type: integer
          minimum: 3
          maximum: 10
        mem:
          type: integer
          minimum: 67108864
          maximum: 268435456
          description: Bộ nhớ Argon2id tính theo byte (64 MiB đến 256 MiB).
        parallelism:
          type: integer
          const: 1
        salt:
          type: string
          pattern: '^[A-Za-z0-9_-]{22}$'
          description: Muối KDF 16 byte mã hoá base64url không padding.
    VaultPasskeyItem:
      type: object
      additionalProperties: false
      required: [id, name, aaguid, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: UUID định danh bản ghi passkey trên server (dùng cho danh sách Settings, PATCH đổi tên và DELETE thu hồi; không phải WebAuthn cred_id).
        name:
          type: string
          minLength: 1
          maxLength: 64
        aaguid:
          type: [string, 'null']
          format: uuid
          description: AAGUID 16 byte của authenticator định dạng chuỗi UUID chuẩn lowercase có gạch nối (ví dụ 00000000-0000-0000-0000-000000000000) hoặc null.
        created_at:
          type: string
          format: date-time
    VaultPasskeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VaultPasskeyItem'
    VaultState:
      type: object
      additionalProperties: false
      required:
        - vault_key_id
        - version
        - kdf
        - vault_key_wrapped_by_kek
        - x25519_public
        - ed25519_public
        - private_keys_wrapped
        - recovery_keys_remaining
        - passkeys
      properties:
        vault_key_id:
          $ref: '#/components/schemas/VaultKeyId'
        version:
          type: integer
          minimum: 1
        kdf:
          $ref: '#/components/schemas/VaultKdf'
        vault_key_wrapped_by_kek:
          $ref: '#/components/schemas/WrappedVaultKey'
        x25519_public:
          $ref: '#/components/schemas/PublicKey32'
        ed25519_public:
          $ref: '#/components/schemas/PublicKey32'
        private_keys_wrapped:
          $ref: '#/components/schemas/WrappedPrivateKeys'
        recovery_keys_remaining:
          type: integer
          minimum: 0
          maximum: 10
        passkeys:
          type: array
          items:
            $ref: '#/components/schemas/VaultPasskeyItem'
    RecoveryKeyUploadItem:
      type: object
      description: 'Phần tử tải lên cho một recovery key gồm {slot, lookup_hash, wrap}. Tạo mới/rotate gửi đủ slot 1…10; regenerate gửi các slot đang trống.'
      additionalProperties: false
      required: [slot, lookup_hash, wrap]
      properties:
        slot:
          type: integer
          minimum: 1
          maximum: 10
          description: Vị trí slot của recovery key (1…10; khi regenerate phải nằm trong empty_slots của GET /vault/recovery-keys).
        lookup_hash:
          $ref: '#/components/schemas/RecoveryKeyLookupHash'
        wrap:
          $ref: '#/components/schemas/WrappedVaultKey'
    VaultCreateRequest:
      type: object
      additionalProperties: false
      required:
        - kdf
        - vault_key_wrapped_by_kek
        - x25519_public
        - ed25519_public
        - private_keys_wrapped
        - recovery_keys
      properties:
        kdf:
          $ref: '#/components/schemas/VaultKdf'
        vault_key_wrapped_by_kek:
          $ref: '#/components/schemas/WrappedVaultKey'
        x25519_public:
          $ref: '#/components/schemas/PublicKey32'
        ed25519_public:
          $ref: '#/components/schemas/PublicKey32'
        private_keys_wrapped:
          $ref: '#/components/schemas/WrappedPrivateKeys'
        recovery_keys:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/RecoveryKeyUploadItem'
    VaultCreatedResponse:
      type: object
      additionalProperties: false
      required: [vault_key_id, version]
      properties:
        vault_key_id:
          $ref: '#/components/schemas/VaultKeyId'
        version:
          type: integer
          minimum: 1
    VaultRewrapRequest:
      type: object
      additionalProperties: false
      required: [kdf, vault_key_wrapped_by_kek]
      properties:
        kdf:
          $ref: '#/components/schemas/VaultKdf'
        vault_key_wrapped_by_kek:
          $ref: '#/components/schemas/WrappedVaultKey'
    VaultVersionResponse:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
    VaultRecoveryKeysStatus:
      type: object
      additionalProperties: false
      required: [remaining, slots, empty_slots]
      properties:
        remaining:
          type: integer
          minimum: 0
          maximum: 10
        slots:
          type: integer
          const: 10
        empty_slots:
          type: array
          maxItems: 10
          items:
            type: integer
            minimum: 1
            maximum: 10
    VaultRecoveryLookupRequest:
      type: object
      additionalProperties: false
      required: [lookup_hash]
      properties:
        lookup_hash:
          $ref: '#/components/schemas/RecoveryKeyLookupHash'
    VaultRecoveryLookupResponse:
      type: object
      additionalProperties: false
      required: [recovery_key_id, wrap]
      properties:
        recovery_key_id:
          type: string
          format: uuid
        wrap:
          $ref: '#/components/schemas/WrappedVaultKey'
    VaultRecoverCompleteRequest:
      type: object
      additionalProperties: false
      required: [recovery_key_id, kdf, vault_key_wrapped_by_kek]
      properties:
        recovery_key_id:
          type: string
          format: uuid
        kdf:
          $ref: '#/components/schemas/VaultKdf'
        vault_key_wrapped_by_kek:
          $ref: '#/components/schemas/WrappedVaultKey'
    VaultRecoveryKeysRegenerateRequest:
      type: object
      description: 'Danh sách 1…(10−remaining) recovery key mới dạng {slot, lookup_hash, wrap} bù vào các slot đang trống.'
      additionalProperties: false
      required: [recovery_keys]
      properties:
        recovery_keys:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/RecoveryKeyUploadItem'
    VaultRecoveryKeysRotateRequest:
      type: object
      additionalProperties: false
      required: [recovery_keys]
      properties:
        recovery_keys:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/RecoveryKeyUploadItem'
    VaultRecoveryKeysMutationResponse:
      type: object
      additionalProperties: false
      required: [remaining, version]
      properties:
        remaining:
          type: integer
          minimum: 1
          maximum: 10
        version:
          type: integer
          minimum: 1
    VaultRecoveryKeysRotateResponse:
      type: object
      additionalProperties: false
      required: [remaining, version]
      properties:
        remaining:
          type: integer
          const: 10
        version:
          type: integer
          minimum: 1
    PrfEvalValuesJSON:
      type: object
      additionalProperties: false
      required: [first]
      description: Đầu vào đánh giá PRF (hmac-secret) dạng JSON; first (và second nếu có) là muối 32 byte mã hoá base64url không padding (client chuyển sang ArrayBuffer/Uint8Array hoặc dùng parseRequestOptionsFromJSON).
      properties:
        first:
          $ref: '#/components/schemas/PrfSalt'
        second:
          $ref: '#/components/schemas/PrfSalt'
    PublicKeyCredentialCreationOptionsJSON:
      type: object
      description: WebAuthn PublicKeyCredentialCreationOptions JSON (challenge, user.id và excludeCredentials.id dùng base64url không padding).
      required: [rp, user, challenge, pubKeyCredParams]
      additionalProperties: true
      properties:
        rp:
          type: object
          required: [name]
          additionalProperties: true
          properties:
            id:
              type: string
            name:
              type: string
        user:
          type: object
          required: [id, name, displayName]
          additionalProperties: true
          properties:
            id:
              type: string
            name:
              type: string
            displayName:
              type: string
        challenge:
          type: string
          description: Challenge 32 byte ngẫu nhiên mã hoá base64url không padding.
        pubKeyCredParams:
          type: array
          items:
            type: object
            required: [type, alg]
            additionalProperties: true
            properties:
              type:
                type: string
              alg:
                type: integer
        timeout:
          type: integer
        excludeCredentials:
          type: array
          items:
            type: object
            required: [type, id]
            additionalProperties: true
            properties:
              type:
                type: string
              id:
                type: string
                pattern: '^[A-Za-z0-9_-]+$'
                description: WebAuthn credential ID (cred_id) mã hoá base64url không padding.
              transports:
                type: array
                items:
                  type: string
        authenticatorSelection:
          type: object
          additionalProperties: true
        attestation:
          type: string
        extensions:
          type: object
          additionalProperties: true
          properties:
            prf:
              type: object
              additionalProperties: false
              properties:
                eval:
                  $ref: '#/components/schemas/PrfEvalValuesJSON'
    VaultPasskeyRegisterOptionsResponse:
      type: object
      additionalProperties: false
      required: [challenge_id, public_key, prf_salt]
      properties:
        challenge_id:
          type: string
          format: uuid
        public_key:
          $ref: '#/components/schemas/PublicKeyCredentialCreationOptionsJSON'
        prf_salt:
          $ref: '#/components/schemas/PrfSalt'
    PasskeyAttestationPayload:
      type: object
      additionalProperties: false
      required: [client_data_json, attestation_object]
      properties:
        client_data_json:
          type: string
          minLength: 1
          description: clientDataJSON từ authenticator mã hoá base64url không padding.
        attestation_object:
          type: string
          minLength: 1
          description: attestationObject CBOR từ authenticator mã hoá base64url không padding.
    VaultPasskeyCreateRequest:
      type: object
      description: |
        Yêu cầu hoàn tất đăng ký passkey. Server chỉ lấy cred_id, pubkey và aaguid từ attestation.attestation_object đã xác minh;
        nếu client gửi kèm các trường dẫn xuất cred_id, pubkey hoặc aaguid ở mức gốc, schema chấp nhận nhưng server luôn bỏ qua hoàn toàn (plan mục 2.5).
      additionalProperties: false
      required: [challenge_id, attestation, prf_salt, vk_wrap, name]
      properties:
        challenge_id:
          type: string
          format: uuid
        attestation:
          $ref: '#/components/schemas/PasskeyAttestationPayload'
        prf_salt:
          $ref: '#/components/schemas/PrfSalt'
        vk_wrap:
          $ref: '#/components/schemas/WrappedVaultKey'
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Tên passkey (trim, 1–64 rune, từ chối ký tự điều khiển và bidi override).
        cred_id:
          type: [string, 'null']
          description: Trường dẫn xuất tuỳ chọn bị server bỏ qua (server tự trích cred_id từ attestation_object đã xác minh, plan mục 2.5).
        pubkey:
          type: [string, 'null']
          description: Trường dẫn xuất tuỳ chọn bị server bỏ qua (server tự trích pubkey từ attestation_object đã xác minh, plan mục 2.5).
        aaguid:
          type: [string, 'null']
          description: Trường dẫn xuất tuỳ chọn bị server bỏ qua (server tự trích aaguid từ attestation_object đã xác minh, plan mục 2.5).
    VaultPasskeyRenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Tên passkey mới (trim, 1–64 rune, từ chối ký tự điều khiển và bidi override).
    PublicKeyCredentialRequestOptionsJSON:
      type: object
      description: WebAuthn PublicKeyCredentialRequestOptions JSON (challenge và allowCredentials.id dùng base64url không padding).
      required: [challenge, allowCredentials]
      additionalProperties: true
      properties:
        challenge:
          type: string
          description: Challenge 32 byte ngẫu nhiên (không lưu DB ở P03) mã hoá base64url không padding.
        timeout:
          type: integer
        rpId:
          type: string
        allowCredentials:
          type: array
          items:
            type: object
            required: [type, id]
            additionalProperties: true
            properties:
              type:
                type: string
              id:
                type: string
                pattern: '^[A-Za-z0-9_-]+$'
                description: WebAuthn credential ID (cred_id) mã hoá base64url không padding (khớp credentials[].id và khoá của extensions.prf.evalByCredential).
              transports:
                type: array
                items:
                  type: string
        userVerification:
          type: string
        extensions:
          type: object
          additionalProperties: true
          description: |
            Phần mở rộng WebAuthn JSON; prf.evalByCredential ánh xạ mỗi cred_id (base64url không padding,
            khớp allowCredentials[].id và credentials[].id) tới {first: prf_salt} (trùng giá trị chuẩn tại credentials[].prf_salt).
          properties:
            prf:
              type: object
              additionalProperties: false
              properties:
                eval:
                  $ref: '#/components/schemas/PrfEvalValuesJSON'
                evalByCredential:
                  type: object
                  description: 'Bản đồ từ WebAuthn cred_id (base64url không padding) sang {first: prf_salt} của từng credential.'
                  additionalProperties:
                    $ref: '#/components/schemas/PrfEvalValuesJSON'
    PasskeyUnlockCredentialItem:
      type: object
      additionalProperties: false
      required: [id, prf_salt, vk_wrap]
      properties:
        id:
          type: string
          minLength: 1
          pattern: '^[A-Za-z0-9_-]+$'
          description: WebAuthn credential ID (cred_id) mã hoá base64url không padding (khớp public_key.allowCredentials[].id và khoá của public_key.extensions.prf.evalByCredential; khác với UUID bản ghi VaultPasskeyItem.id trên Settings — bước mở khoá không cần ánh xạ về UUID bản ghi).
        prf_salt:
          $ref: '#/components/schemas/PrfSalt'
          description: Muối PRF 32 byte chuẩn (authoritative) của credential này, bằng chính xác public_key.extensions.prf.evalByCredential[id].first.
        vk_wrap:
          $ref: '#/components/schemas/WrappedVaultKey'
    VaultPasskeyUnlockOptionsResponse:
      type: object
      description: |
        Options mở khoá bằng passkey. Trường credentials[].id là WebAuthn cred_id (base64url không padding) khớp allowCredentials[].id
        và khoá của extensions.prf.evalByCredential; credentials[].prf_salt là giá trị chuẩn khớp evalByCredential[id].first.
        Bước mở khoá cục bộ không cần ánh xạ về UUID bản ghi VaultPasskeyItem.id.
      additionalProperties: false
      required: [public_key, credentials]
      properties:
        public_key:
          $ref: '#/components/schemas/PublicKeyCredentialRequestOptionsJSON'
        credentials:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PasskeyUnlockCredentialItem'
    ItemName:
      type: string
      minLength: 1
      maxLength: 200
      description: |
        Tên mục, plaintext trên server (không mã hoá). 1–200 rune sau trim; server chuẩn hoá (plan P04 mục 2.2) và từ chối
        ký tự điều khiển, bidi override hoặc kết quả chuẩn hoá rỗng (`name_invalid`). Trùng tên được phép.
    ItemHint:
      type: [string, 'null']
      maxLength: 120
      description: Gợi ý tuỳ chọn, plaintext máy chủ đọc được; 0–120 rune; `null` = không có hoặc xoá hint.
    TagDisplay:
      type: string
      minLength: 1
      maxLength: 50
      description: Tên hiển thị của tag, plaintext; 1–50 rune sau trim (`tag_display_invalid`). Unique theo dạng chuẩn hoá trong số tag sống.
    TagRef:
      type: object
      additionalProperties: false
      required: [id, display]
      properties:
        id:
          type: string
          format: uuid
        display:
          $ref: '#/components/schemas/TagDisplay'
    ItemSummary:
      type: object
      additionalProperties: false
      required: [id, name, hint, tags, entry_count, version, created_at, updated_at, last_used_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/ItemName'
        hint:
          $ref: '#/components/schemas/ItemHint'
        tags:
          type: array
          maxItems: 20
          description: Tag **sống** gắn với mục, sắp theo `display`. Luôn là mảng (rỗng `[]` khi chưa có tag), không bao giờ `null`.
          items:
            $ref: '#/components/schemas/TagRef'
        entry_count:
          type: integer
          minimum: 0
          maximum: 200
          description: Số entry sống của mục.
        version:
          type: integer
          minimum: 1
          description: Tăng khi `name` hoặc `hint` đổi; dùng cho `If-Match` của `itemUpdate`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    ItemList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: Luôn là mảng, rỗng `[]` khi không có kết quả.
          items:
            $ref: '#/components/schemas/ItemSummary'
        next_cursor:
          type: [string, 'null']
    ItemLookupResult:
      type: object
      additionalProperties: false
      required: [items, total, next_cursor]
      properties:
        items:
          type: array
          description: Luôn là mảng, rỗng `[]` khi không có mục trùng tên.
          items:
            $ref: '#/components/schemas/ItemSummary'
        total:
          type: integer
          minimum: 0
          description: Tổng số mục sống trùng tên chính xác (count trong cùng snapshot), không chỉ số mục của trang này.
        next_cursor:
          type: [string, 'null']
    ItemCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: UUID do client sinh một lần (quick-add) để retry không tạo bản sao; bỏ trống thì server sinh.
        name:
          $ref: '#/components/schemas/ItemName'
        hint:
          $ref: '#/components/schemas/ItemHint'
    ItemUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/ItemName'
        hint:
          $ref: '#/components/schemas/ItemHint'
    ItemTagsAddRequest:
      type: object
      additionalProperties: false
      required: [tag_ids]
      properties:
        tag_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
    ItemEntriesReorderRequest:
      type: object
      additionalProperties: false
      required: [entry_ids]
      properties:
        entry_ids:
          type: array
          maxItems: 200
          uniqueItems: true
          description: |
            Hoán vị đúng tập entry sống của mục, theo thứ tự mới. Mục không có entry sống → `[]` hợp lệ (200 `{entries: []}`);
            `[]` khi mục còn entry sống là lệch tập → `409 reorder_mismatch`, không phải 400.
          items:
            $ref: '#/components/schemas/EntryIdValue'
    EntryPosition:
      type: object
      additionalProperties: false
      required: [id, position]
      properties:
        id:
          $ref: '#/components/schemas/EntryIdValue'
        position:
          type: integer
          minimum: 0
    ItemEntriesReorderResponse:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          description: Mọi entry sống của mục với `position` mới 0…n−1, theo thứ tự mới. Luôn là mảng.
          items:
            $ref: '#/components/schemas/EntryPosition'
    Tag:
      type: object
      additionalProperties: false
      required: [id, display, item_count, last_used_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        display:
          $ref: '#/components/schemas/TagDisplay'
        item_count:
          type: integer
          minimum: 0
          description: Số mục sống gắn tag này.
        last_used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    TagList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: Luôn là mảng, rỗng `[]` khi không có tag.
          items:
            $ref: '#/components/schemas/Tag'
        next_cursor:
          type: [string, 'null']
    TagUpsertRequest:
      type: object
      additionalProperties: false
      required: [display]
      properties:
        display:
          $ref: '#/components/schemas/TagDisplay'
    TagRenameRequest:
      type: object
      additionalProperties: false
      required: [display]
      properties:
        display:
          $ref: '#/components/schemas/TagDisplay'
    EntryType:
      type: string
      enum: [text, json]
      description: Kiểu entry, plaintext (chọn renderer trước khi giải mã); không nằm trong envelope/AAD.
    EntryIdValue:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: UUID v4 chữ thường do client sinh trước khi seal; nằm trong AAD nên server giữ nguyên.
    EntryEnvelopeV1:
      type: object
      additionalProperties: false
      required: [v, alg, key_id, nonce, ct_enc]
      description: |
        Envelope v1 đúng 5 field (SPEC §5.5). Server kiểm strict trên byte thô của request (field thiếu/thừa, key trùng kể cả qua
        escape, kiểu sai, UTF-8 lỗi → `entry_invalid`), rồi so `key_id` với `vault_key_id` hiện tại (`entry_key_mismatch`).
      properties:
        v:
          type: integer
          const: 1
        alg:
          type: string
          const: xchacha20poly1305-ietf
        key_id:
          type: string
          pattern: '^(?:vk|sk):[A-Za-z0-9_-]{22}$'
          description: Định dạng cho phép `sk:` (P08) nhưng MVP chỉ nhận đúng `vault_key_id` hiện tại.
        nonce:
          type: string
          pattern: '^[A-Za-z0-9_-]{32}$'
          description: 24 byte ngẫu nhiên, base64url không padding; mỗi lần seal một nonce mới.
        ct_enc:
          type: string
          const: utf8
    EntryCiphertext:
      type: string
      minLength: 23
      maxLength: 350891
      pattern: '^[A-Za-z0-9_-]+$'
      description: AEAD body ‖ tag 16 B, base64url không padding; 17…263168 byte sau khi giải mã strict.
    PlaintextLenBucket:
      type: integer
      minimum: 256
      maximum: 262144
      multipleOf: 256
      description: |
        Metadata làm tròn, bằng đúng `ceil((octet_length(ciphertext) − 16) / 256) × 256` (server kiểm). Không che độ dài thật:
        độ dài ciphertext vẫn lộ độ dài plaintext chính xác (ADR 0005, threat model P-1/L-9).
    EntryMeta:
      type: object
      additionalProperties: false
      required: [id, item_id, type, position, version, plaintext_len_bucket, created_at, updated_at]
      description: Metadata entry, không envelope, không ciphertext, không plaintext.
      properties:
        id:
          $ref: '#/components/schemas/EntryIdValue'
        item_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/EntryType'
        position:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
          description: Chỉ tăng khi body đổi (`entryUpdate`); reorder/xoá/restore không tăng. Dùng cho `If-Match`.
        plaintext_len_bucket:
          $ref: '#/components/schemas/PlaintextLenBucket'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Entry:
      type: object
      additionalProperties: false
      required: [id, item_id, type, position, version, plaintext_len_bucket, created_at, updated_at, envelope, ciphertext]
      description: '`EntryMeta` kèm `envelope` và `ciphertext` để client giải mã một lần rồi bỏ.'
      properties:
        id:
          $ref: '#/components/schemas/EntryIdValue'
        item_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/EntryType'
        position:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        plaintext_len_bucket:
          $ref: '#/components/schemas/PlaintextLenBucket'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        envelope:
          $ref: '#/components/schemas/EntryEnvelopeV1'
        ciphertext:
          $ref: '#/components/schemas/EntryCiphertext'
    EntryMetaList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: Luôn là mảng, rỗng `[]` khi mục chưa có entry.
          items:
            $ref: '#/components/schemas/EntryMeta'
        next_cursor:
          type: [string, 'null']
    EntryCreateRequest:
      type: object
      additionalProperties: false
      required: [id, type, envelope, ciphertext, plaintext_len_bucket]
      properties:
        id:
          $ref: '#/components/schemas/EntryIdValue'
        type:
          $ref: '#/components/schemas/EntryType'
        envelope:
          $ref: '#/components/schemas/EntryEnvelopeV1'
        ciphertext:
          $ref: '#/components/schemas/EntryCiphertext'
        plaintext_len_bucket:
          $ref: '#/components/schemas/PlaintextLenBucket'
    EntryImportJsonRequest:
      type: object
      additionalProperties: false
      required: [id, type, envelope, ciphertext, plaintext_len_bucket, source]
      properties:
        id:
          $ref: '#/components/schemas/EntryIdValue'
        type:
          type: string
          const: json
        envelope:
          $ref: '#/components/schemas/EntryEnvelopeV1'
        ciphertext:
          $ref: '#/components/schemas/EntryCiphertext'
        plaintext_len_bucket:
          $ref: '#/components/schemas/PlaintextLenBucket'
        source:
          type: string
          enum: [paste, file]
          description: Nguồn import, chỉ dùng cho audit (`import_source`). Không có `filename`.
    EntryUpdateRequest:
      type: object
      additionalProperties: false
      required: [envelope, ciphertext, plaintext_len_bucket]
      properties:
        envelope:
          $ref: '#/components/schemas/EntryEnvelopeV1'
        ciphertext:
          $ref: '#/components/schemas/EntryCiphertext'
        plaintext_len_bucket:
          $ref: '#/components/schemas/PlaintextLenBucket'
    EntryChange:
      type: object
      additionalProperties: false
      required: [id, item_id, type, position, version, plaintext_len_bucket, created_at, updated_at, deleted_at]
      description: Thay đổi của một entry (gồm tombstone); không envelope, không ciphertext.
      properties:
        id:
          $ref: '#/components/schemas/EntryIdValue'
        item_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/EntryType'
        position:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 1
        plaintext_len_bucket:
          $ref: '#/components/schemas/PlaintextLenBucket'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, 'null']
          format: date-time
          description: Khác `null` khi entry đã bị xoá mềm (tombstone).
    EntryChangesPage:
      type: object
      additionalProperties: false
      required: [changes, next_cursor, watermark]
      properties:
        changes:
          type: array
          description: Luôn là mảng, rỗng `[]` khi không có thay đổi.
          items:
            $ref: '#/components/schemas/EntryChange'
        next_cursor:
          type: [string, 'null']
        watermark:
          type: string
          format: date-time
          description: Thời điểm server ở đầu trang đầu của chuỗi; client chỉ lưu sau khi đọc hết trang cuối.
    EmptyObject:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: 'Body `{}` của các POST restore (vẫn cần `Content-Type: application/json`).'
