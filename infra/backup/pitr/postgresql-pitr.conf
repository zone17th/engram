# engram PITR server config (P06 Task 9). Loaded with:
#   postgres -c config_file=/etc/postgresql/postgresql-pitr.conf
# The cluster's own postgresql.conf is included first; the PITR settings below win.
# postgresql.auto.conf (ALTER SYSTEM) is still read last by the server.
data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'
include_if_exists = '/var/lib/postgresql/data/postgresql.conf'

wal_level = replica
archive_mode = on
archive_timeout = 300s
# Runs inside the container as user postgres. Archive dir (absolute, in container):
# /var/lib/postgresql/wal-archive = host ~/backups/engram/pitr/wal (owner postgres, 0700).
archive_command = '/etc/postgresql/engram-wal-archive.sh %p %f'
# pg_basebackup -X fetch takes WAL only from pg_wal of the source (never from the gzip/GPG archive).
# 2GB >= measured WAL rate x max base duration x 2 (see docs/phases/evidence/P06/ops-dr.md).
wal_keep_size = 2GB
