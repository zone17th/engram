# Đọc digest từ image-pins.env: docker compose --env-file infra/image-pins.env ...
name: engram

services:
  db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: engram
      POSTGRES_PASSWORD: engram
      POSTGRES_DB: engram
    ports: ['5432:5432']
    volumes: ['engram-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U engram -d engram']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        GO_BUILD_IMAGE: ${GO_BUILD_IMAGE}
        DISTROLESS_IMAGE: ${DISTROLESS_IMAGE}
    command: ['/app/migrate', 'up']
    environment:
      DATABASE_URL: postgres://engram:engram@db:5432/engram?sslmode=disable
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'

  # Distroless api/worker run as nonroot (uid 65532). Host-owned 0755 bind
  # mounts are not writable → mail Send 503 and empty sink for Playwright.
  mail-sink-perms:
    image: ${NODE_IMAGE}
    user: '0:0'
    volumes:
      - ../.data/mail-sink:/sink
    command: ['sh', '-c', 'chmod 0777 /sink']
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        GO_BUILD_IMAGE: ${GO_BUILD_IMAGE}
        DISTROLESS_IMAGE: ${DISTROLESS_IMAGE}
    command: ['/app/api']
    environment:
      DATABASE_URL: postgres://engram:engram@db:5432/engram?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
      APP_ENV: development
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      # P05 embedding & search (plan mục 2.13, SPEC §4.4).
      # Default profile stays noop (semantic unavailable). Int/bool/duration vars
      # use config.go defaults explicitly because envconfig only applies struct
      # defaults when an env var is unset (or empty without any custom field
      # overrides), while strings/custom-parsed durations accept empty safely.
      # Shadow EMBEDDING_SHADOW_* vars are omitted here and set only in the VPS
      # env during generation cutover (§6.6).
      SEARCH_SEMANTIC_ENABLED: ${SEARCH_SEMANTIC_ENABLED:-true}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-noop}
      TEI_URL: ${TEI_URL:-}
      TEI_INPUT_PREFIX_QUERY: ${TEI_INPUT_PREFIX_QUERY:-}
      TEI_INPUT_PREFIX_DOCUMENT: ${TEI_INPUT_PREFIX_DOCUMENT:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openrouter/qwen/qwen3-embedding-8b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_QUERY_INSTRUCTION: ${EMBEDDING_QUERY_INSTRUCTION:-Given a short search query, retrieve matching item names or tags}
      EMBEDDING_QUERY_TIMEOUT: ${EMBEDDING_QUERY_TIMEOUT:-}
      EMBEDDING_DOCUMENT_TIMEOUT: ${EMBEDDING_DOCUMENT_TIMEOUT:-30s}
      SEARCH_EXACT_MAX_VECTORS: ${SEARCH_EXACT_MAX_VECTORS:-5000}
      SEARCH_EXACT_FALLBACK_MAX_VECTORS: ${SEARCH_EXACT_FALLBACK_MAX_VECTORS:-20000}
      SEARCH_HNSW_EF_SEARCH: ${SEARCH_HNSW_EF_SEARCH:-64}
      SEARCH_HNSW_MAX_SCAN_TUPLES: ${SEARCH_HNSW_MAX_SCAN_TUPLES:-20000}
      SEARCH_HNSW_ITERATIVE_SCAN: ${SEARCH_HNSW_ITERATIVE_SCAN:-relaxed_order}
      SEARCH_ANN_RANDOM_PAGE_COST: ${SEARCH_ANN_RANDOM_PAGE_COST:-}
      SEARCH_VECTOR_BRANCH_TIMEOUT: ${SEARCH_VECTOR_BRANCH_TIMEOUT:-80ms}
      SEARCH_VECTOR_FALLBACK_MIN_BUDGET: ${SEARCH_VECTOR_FALLBACK_MIN_BUDGET:-30ms}
      SEARCH_ROLLBACK_WINDOW: ${SEARCH_ROLLBACK_WINDOW:-168h}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      AUTH_FAKE_OAUTH: ${AUTH_FAKE_OAUTH:-true}
      AUTH_MAIL_SINK_DIR: /tmp/engram-mail
      AUTH_MAIL_CAPTURE_AS_DELIVERY: ${AUTH_MAIL_CAPTURE_AS_DELIVERY:-false}
      AUTH_TRUSTED_PROXY_CIDRS: 172.16.0.0/12,10.0.0.0/8,127.0.0.1/32
    volumes:
      - ../.data/mail-sink:/tmp/engram-mail
    ports: ['8080:8080']
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      mail-sink-perms: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', '/app/api', '-healthcheck']
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        GO_BUILD_IMAGE: ${GO_BUILD_IMAGE}
        DISTROLESS_IMAGE: ${DISTROLESS_IMAGE}
    command: ['/app/worker']
    environment:
      DATABASE_URL: postgres://engram:engram@db:5432/engram?sslmode=disable
      APP_ENV: development
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      # P05 embedding & search (plan mục 2.13, SPEC §4.4).
      # Shadow EMBEDDING_SHADOW_* vars are omitted here (set in the VPS env during cutover).
      SEARCH_SEMANTIC_ENABLED: ${SEARCH_SEMANTIC_ENABLED:-true}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-noop}
      TEI_URL: ${TEI_URL:-}
      TEI_INPUT_PREFIX_QUERY: ${TEI_INPUT_PREFIX_QUERY:-}
      TEI_INPUT_PREFIX_DOCUMENT: ${TEI_INPUT_PREFIX_DOCUMENT:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openrouter/qwen/qwen3-embedding-8b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_QUERY_INSTRUCTION: ${EMBEDDING_QUERY_INSTRUCTION:-Given a short search query, retrieve matching item names or tags}
      EMBEDDING_QUERY_TIMEOUT: ${EMBEDDING_QUERY_TIMEOUT:-}
      EMBEDDING_DOCUMENT_TIMEOUT: ${EMBEDDING_DOCUMENT_TIMEOUT:-30s}
      SEARCH_EXACT_MAX_VECTORS: ${SEARCH_EXACT_MAX_VECTORS:-5000}
      SEARCH_EXACT_FALLBACK_MAX_VECTORS: ${SEARCH_EXACT_FALLBACK_MAX_VECTORS:-20000}
      SEARCH_HNSW_EF_SEARCH: ${SEARCH_HNSW_EF_SEARCH:-64}
      SEARCH_HNSW_MAX_SCAN_TUPLES: ${SEARCH_HNSW_MAX_SCAN_TUPLES:-20000}
      SEARCH_HNSW_ITERATIVE_SCAN: ${SEARCH_HNSW_ITERATIVE_SCAN:-relaxed_order}
      SEARCH_ANN_RANDOM_PAGE_COST: ${SEARCH_ANN_RANDOM_PAGE_COST:-}
      SEARCH_VECTOR_BRANCH_TIMEOUT: ${SEARCH_VECTOR_BRANCH_TIMEOUT:-80ms}
      SEARCH_VECTOR_FALLBACK_MIN_BUDGET: ${SEARCH_VECTOR_FALLBACK_MIN_BUDGET:-30ms}
      SEARCH_ROLLBACK_WINDOW: ${SEARCH_ROLLBACK_WINDOW:-168h}
      WORKER_METRICS_ADDR: ${WORKER_METRICS_ADDR:-}
      # Test-only periodic interval for embedding_bootstrap_flip (M3; rejected in production;
      # only CI job e2e-search-semantic sets 5s).
      EMBEDDING_BOOTSTRAP_FLIP_INTERVAL: ${EMBEDDING_BOOTSTRAP_FLIP_INTERVAL:-}
      AUTH_MAIL_SINK_DIR: /tmp/engram-mail
    volumes:
      - ../.data/mail-sink:/tmp/engram-mail
    depends_on:
      migrate: { condition: service_completed_successfully }
      mail-sink-perms: { condition: service_completed_successfully }

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        API_UPSTREAM: ${COMPOSE_API_UPSTREAM:-http://api:8080}
        NEXT_PUBLIC_CONTENT_ENABLED: ${NEXT_PUBLIC_CONTENT_ENABLED:-false}
    environment:
      # Browser vẫn chỉ nói chuyện với web trên một origin; Next proxy tiếp sang api.
      API_UPSTREAM: ${COMPOSE_API_UPSTREAM:-http://api:8080}
      NEXT_PUBLIC_CONTENT_ENABLED: ${NEXT_PUBLIC_CONTENT_ENABLED:-false}
    ports: ['3000:3000']
    depends_on: [api]

  # TEI là OPTIONAL (profile `semantic`, opt-in). Không bật profile này thì
  # EMBEDDING_PROVIDER=noop và semantic không khả dụng — readyz vẫn pass (P01 §Contract).
  # Note: the pinned TEI_IMAGE digest is single-arch linux/amd64 only; host `bro`
  # (ARM64) uses `openai_compat` (OQ-23, user-dec-021).
  tei:
    image: ${TEI_IMAGE}
    profiles: ['semantic']
    command: ['--model-id', '${TEI_MODEL_ID:-BAAI/bge-m3}']
    ports: ['8081:80']
    volumes: ['engram-tei:/data']
    healthcheck:
      # Bash /dev/tcp probe on GET /health needs no curl/wget binary in the slim runtime image.
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/80 && printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -n 1 <&3 | grep -q "200"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # CI-only fake embedding provider (profile `semantic-fake`, Task 16 / Task 20b).
  # Built from Dockerfile target `fakeembed`; never included in the production
  # image or default compose stack, and refuses to start outside development|staging.
  #
  # How to start (cite dec-262 & advisor-dec-279):
  #   EMBEDDING_PROVIDER=tei TEI_URL=http://fakeembed:8080 TEI_INPUT_PREFIX_QUERY='query: ' TEI_INPUT_PREFIX_DOCUMENT='passage: ' docker compose --profile semantic-fake up
  # Why prefixes are required for semantic-fake: fakeembed classifies query vs
  # document requests by matching the non-empty TEI query prefix (and refuses to
  # start when FAKEEMBED_QUERY_PREFIX is empty/whitespace); the fake calibration
  # entry in calibration.go accepts any qp/dp suffix for fakeembed-v1.
  # Deviation from plan text (advisor-dec-279): dec-262 fixed the CI fake
  # calibration entry in calibration.go as provider="tei", model="tei/engram-fakeembed",
  # model_version prefix="fakeembed-v1;", so semantic-fake runs api/worker with
  # EMBEDDING_PROVIDER=tei and TEI_URL=http://fakeembed:8080 (an openai_compat
  # identity would not match calibration).
  # URL rule (urlrule.go): CheckURL accepts http://fakeembed:8080 at config load
  # (hostname without DNS), and NewHTTPClient validates at dial time that the
  # resolved Docker bridge IP is in RFC 1918 private space.
  fakeembed:
    profiles: ['semantic-fake']
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: fakeembed
      args:
        GO_BUILD_IMAGE: ${GO_BUILD_IMAGE}
        DISTROLESS_IMAGE: ${DISTROLESS_IMAGE}
    command: ['/app/fakeembed']
    environment:
      APP_ENV: development
      FAKEEMBED_QUERY_PREFIX: ${TEI_INPUT_PREFIX_QUERY:-}
    ports: ['127.0.0.1:${FAKEEMBED_PORT:-8090}:8080']
    healthcheck:
      test: ['CMD', '/app/fakeembed', '-healthcheck']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  engram-db:
  engram-tei:
