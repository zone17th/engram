# Canonical nginx vhost config for engram.zone17.click (mounted in global_nginx at
# ~/global-infra/nginx/conf.d/engram.conf on bro; applied in PROD-STEP-7).
# Included at the http{} level by /etc/nginx/nginx.conf.

# Scrub export job UUIDs from access logs so /api/v1/exports/<uuid>[/...] is
# recorded only by its route template (P06-T8, R1-18).
map $uri $engram_log_uri {
    ~^/api/v1/exports/[^/]+(/.*)?$ "/api/v1/exports/{id}$1";
    default $uri;
}

# Gate 8a (P05) + R1-18 (P06): log method + scrubbed path only (no query string,
# no request body, no Referer).
log_format engram_noquery '$remote_addr - $remote_user [$time_local] "$request_method $engram_log_uri" '
                          '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    server_name engram.zone17.click;
    server_tokens off;

    access_log /var/log/nginx/access.log engram_noquery;
    error_log /var/log/nginx/error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name engram.zone17.click;
    server_tokens off;

    access_log /var/log/nginx/access.log engram_noquery;
    error_log /var/log/nginx/error.log warn;

    ssl_certificate /etc/letsencrypt/live/engram.zone17.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/engram.zone17.click/privkey.pem;

    # PROD-STEP-7 rollout: stage with max-age=300 first, verify HTTPS/WebAuthn/cookie
    # and /api/v1/metrics=404, then raise to max-age=31536000; includeSubDomains.
    # Upstream HSTS is stripped via proxy_hide_header so the edge is the single emitter.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/v1/metrics {
        return 404;
    }

    # Suppress upstream-error request logging (level "error") on export endpoints so
    # export job UUIDs and query strings are never written to error.log on 502/504
    # (P06-T8, R1-18, R1-BE-01 / R1-10).
    location ^~ /api/v1/exports/ {
        error_log /var/log/nginx/error.log crit;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $engram_web http://engram-web:3000;
        proxy_pass $engram_web;
        proxy_hide_header Strict-Transport-Security;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $engram_web http://engram-web:3000;
        proxy_pass $engram_web;
        proxy_hide_header Strict-Transport-Security;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
